[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "3.0.0"
description = "AI-powered phishing email detection with domain intelligence and pattern analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Venkat Vatsav"},
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "python-whois>=0.9.0",
    "dnspython>=2.6.0",
    "requests>=2.31.0",
]
optional-dependencies = {
    "dev": ["pytest>=7.4", "flake8>=6.1"],
}

[project.urls]
homepage = "https://github.com/venkatvatsav2003/PhishGuard-AI"

[project.scripts]
phishguard = "phishguard:main"

[tool.setuptools]
packages = ["phishguard"]
package-dir = {"phishguard" = "."}
