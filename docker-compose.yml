version: "3.8"

services:
  phishguard:
    build: .
    stdin_open: true
    tty: true
    command: --interactive

  api:
    build: .
    ports:
      - "8000:8000"
    profiles:
      - api
    environment:
      - PHISHGUARD_PORT=8000
      - PHISHGUARD_WORKERS=4
    command: python3 -m uvicorn phishguard_api:app --host 0.0.0.0 --port 8000
